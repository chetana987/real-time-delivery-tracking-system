server:
  port: ${SERVER_PORT:8080}
  error:
    # never leak exception messages or stack traces to API clients
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: delivery-tracking

  # ===================== MySQL =====================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:delivery_tracking}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:chetana}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # ===================== Redis =====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jackson:
    serialization:
      write-dates-as-timestamps: false

# ===================== OpenAPI / Swagger =====================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  # do not auto-inject the @RestControllerAdvice generic Exception handler (500)
  # into every operation; status codes are documented explicitly per endpoint
  override-with-generic-response: false

# ===================== JWT =====================
app:
  jwt:
    # HS256 requires the secret to be at least 32 bytes long.
    # REQUIRED: the secret must be provided via the JWT_SECRET environment
    # variable. There is intentionally no fallback default, so an unconfigured
    # secret fails fast at startup instead of silently using a known value.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # how far (km) to look for online delivery partners when a new order is placed
  partner-search-radius-km: ${PARTNER_SEARCH_RADIUS_KM:10}
  # min interval (s) between location updates from the same delivery partner
  location-update-min-interval-seconds: ${LOCATION_UPDATE_MIN_INTERVAL_SECONDS:2}

logging:
  level:
    com.deliverytracking: DEBUG
