name: delivery-tracking

services:
  mysql:
    image: mysql:8.4
    container_name: delivery-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:delivery-root-dev}
      MYSQL_DATABASE: ${MYSQL_DB:delivery_tracking}
      MYSQL_USER: ${MYSQL_USER:delivery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:delivery-dev}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Verifies the server accepts real TCP connections with root auth.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - delivery-net
    ports:
      # Optional: lets you inspect the DB from the host with any MySQL client.
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:delivery-redis-dev}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - delivery-net
    ports:
      # Optional: lets you inspect Redis from the host (e.g. redis-cli).
      - "6379:6379"

  backend:
    build: .
    image: delivery-tracking-backend:latest
    container_name: delivery-backend
    restart: unless-stopped
    environment:
      # The backend connects to MySQL/Redis over the docker network using the
      # service names as hosts. application.yml already reads all of these.
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:delivery_tracking}
      MYSQL_USER: ${MYSQL_USER:delivery}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:delivery-dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:delivery-redis-dev}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:86400000}
      PARTNER_SEARCH_RADIUS_KM: ${PARTNER_SEARCH_RADIUS_KM:10}
      LOCATION_UPDATE_MIN_INTERVAL_SECONDS: ${LOCATION_UPDATE_MIN_INTERVAL_SECONDS:2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    ports:
      - "8080:8080"
    networks:
      - delivery-net

networks:
  delivery-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
